name: ci

on:
  push:
    branches: [main, master]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      # Pin third-party actions to immutable commit SHAs (tag comments for humans).
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.2.2
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt
          pip install -e .
      - name: Unit tests
        run: pytest -q
      - name: Golden regressions
        run: bury-bench check-golden --golden golden
      - name: Validate sample results
        run: bury-bench validate-results samples
      - name: Refresh leaderboard (deterministic samples)
        run: bury-bench leaderboard samples --out docs/LEADERBOARD.md
      - name: Ensure leaderboard is current
        run: |
          git diff --exit-code docs/LEADERBOARD.md || (
            echo "docs/LEADERBOARD.md is stale; regenerate with:"
            echo "  bury-bench leaderboard samples --out docs/LEADERBOARD.md"
            exit 1
          )
