<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 320" role="img" aria-labelledby="title desc">
  <title id="title">Good chat versus buried chat</title>
  <desc id="desc">Side-by-side comparison of sample scores 76.9 and 7.9.</desc>
  <rect width="960" height="320" rx="16" fill="#0f172a"/>
  <text x="32" y="36" fill="#e2e8f0" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="16" font-weight="700">Good chat vs buried chat</text>
  <text x="32" y="56" fill="#94a3b8" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12">Same multi-turn setup - only the last assistant message changes</text>

  <rect x="32" y="76" width="430" height="212" rx="14" fill="#14532d" stroke="#22c55e" stroke-width="2"/>
  <text x="52" y="108" fill="#86efac" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13" font-weight="700">samples/chat.jsonl</text>
  <text x="52" y="148" fill="#bbf7d0" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="42" font-weight="800">76.9</text>
  <text x="180" y="148" fill="#86efac" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="14">action score</text>
  <text x="52" y="178" fill="#dcfce7" font-family="Consolas, Menlo, monospace" font-size="12">Step 1 of 3 done: schema updated.</text>
  <text x="52" y="196" fill="#dcfce7" font-family="Consolas, Menlo, monospace" font-size="12">Next: run python backfill.py</text>
  <rect x="52" y="216" width="110" height="26" rx="8" fill="#166534"/>
  <text x="107" y="234" text-anchor="middle" fill="#bbf7d0" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="11">restate_state</text>
  <rect x="172" y="216" width="120" height="26" rx="8" fill="#166534"/>
  <text x="232" y="234" text-anchor="middle" fill="#bbf7d0" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="11">one_next_action</text>
  <rect x="302" y="216" width="100" height="26" rx="8" fill="#7f1d1d"/>
  <text x="352" y="234" text-anchor="middle" fill="#fecaca" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="11">action_first</text>
  <text x="52" y="268" fill="#86efac" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="11">Mostly good - two weighted misses keep it under 100</text>

  <rect x="498" y="76" width="430" height="212" rx="14" fill="#7f1d1d" stroke="#ef4444" stroke-width="2"/>
  <text x="518" y="108" fill="#fecaca" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13" font-weight="700">samples/chat-buried.jsonl</text>
  <text x="518" y="148" fill="#fecaca" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="42" font-weight="800">7.9</text>
  <text x="640" y="148" fill="#fca5a5" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="14">action score</text>
  <text x="518" y="178" fill="#fee2e2" font-family="Consolas, Menlo, monospace" font-size="12">Great question! Let me think...</text>
  <text x="518" y="196" fill="#fee2e2" font-family="Consolas, Menlo, monospace" font-size="12">Hope this helps! Let me know...</text>
  <rect x="518" y="216" width="100" height="26" rx="8" fill="#991b1b"/>
  <text x="568" y="234" text-anchor="middle" fill="#fecaca" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="11">no_preamble</text>
  <rect x="628" y="216" width="90" height="26" rx="8" fill="#991b1b"/>
  <text x="673" y="234" text-anchor="middle" fill="#fecaca" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="11">no_closer</text>
  <rect x="728" y="216" width="80" height="26" rx="8" fill="#991b1b"/>
  <text x="768" y="234" text-anchor="middle" fill="#fecaca" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="11">no_idiom</text>
  <rect x="818" y="216" width="90" height="26" rx="8" fill="#991b1b"/>
  <text x="863" y="234" text-anchor="middle" fill="#fecaca" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="11">+ 6 more</text>
  <text x="518" y="268" fill="#fca5a5" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="11">Almost every applicable rule failed</text>

  <text x="32" y="310" fill="#64748b" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="11">Reproduce: bury-bench ingest samples/chat.jsonl  and  samples/chat-buried.jsonl</text>
</svg>
